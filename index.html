<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الصف - متابعة الدور</title>
    
    <!-- استدعاء مكتبة Firebase Web SDK (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #f0f2f5; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card { 
            background: #ffffff; 
            padding: 40px 30px; 
            border-radius: 24px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
            max-width: 420px; 
            width: 90%; 
            transition: transform 0.2s ease;
        }

        h1 { 
            color: #444; 
            font-size: 24px; 
            margin-bottom: 10px; 
            font-weight: 600;
        }

        .number-box {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 10px;
            margin: 15px 0;
            border: 2px solid #e9ecef;
        }

        .number { 
            font-size: 100px; 
            color: #0d6efd; 
            font-weight: 800; 
            line-height: 1.1;
            transition: color 0.3s ease, transform 0.2s ease;
        }

        /* تأثير فلاش عند تغير الرقم */
        .number.updated {
            transform: scale(1.08);
            color: #198754;
        }

        .console-info { 
            font-size: 22px; 
            color: #495057; 
            margin-bottom: 25px; 
            background: #e7f1ff; 
            padding: 12px; 
            border-radius: 12px; 
            border: 1px solid #b6d4fe;
        }

        .console-num {
            font-weight: bold; 
            color: #0d6efd;
            font-size: 26px;
        }

        .status-container {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 20px;
            background-color: #e9ecef;
            color: #6c757d;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #dc3545; /* أحمر عند الانفصال */
            display: inline-block;
        }

        .status-container.online {
            background-color: #d1e7dd;
            color: #0f5132;
        }

        .status-container.online .status-dot {
            background-color: #198754; /* أخضر عند الاتصال */
            box-shadow: 0 0 8px #198754;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>رقم الدور الحالي</h1>
        <div class="number-box">
            <div class="number" id="queueNum">--</div>
        </div>
        <div class="console-info">
            الشباك / الكونسول: <span class="console-num" id="consoleNum">--</span>
        </div>
        
        <div class="status-container" id="statusContainer">
            <span class="status-dot"></span>
            <span id="statusText">جاري الاتصال بالنظام...</span>
        </div>
    </div>

    <script>
        // إعدادات Firebase
        const firebaseConfig = {
            databaseURL: "https://qms-online-2658d-default-rtdb.firebaseio.com/"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const queueNumEl = document.getElementById('queueNum');
        const consoleNumEl = document.getElementById('consoleNum');
        const statusContainer = document.getElementById('statusContainer');
        const statusText = document.getElementById('statusText');

        // مولد صوت التنبيه (Ding) باستخدام Web Audio API دون الحاجة لملفات خارجية
        function playChime() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); // نغمة A5
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.8);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            } catch (e) {
                // في حال منع المتصفح الصوت قبل التفاعل
            }
        }

        // دالة إعطاء تأثير بصري عند التحديث
        function triggerUpdateAnimation() {
            queueNumEl.classList.add('updated');
            setTimeout(() => {
                queueNumEl.classList.remove('updated');
            }, 400);
        }

        // 1. مراقبة رقم الدور الحالي
        db.ref('queue/current_ticket').on('value', (snapshot) => {
            const val = snapshot.val();
            if (val !== null) {
                if (queueNumEl.innerText !== String(val) && queueNumEl.innerText !== '--') {
                    playChime();
                    triggerUpdateAnimation();
                }
                queueNumEl.innerText = val;
            }
        });

        // 2. مراقبة رقم الكونسول الحالي
        db.ref('queue/current_console').on('value', (snapshot) => {
            const val = snapshot.val();
            if (val !== null) {
                consoleNumEl.innerText = val;
            }
        });

        // 3. مراقبة حالة الاتصال بالخادم
        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                statusContainer.classList.add('online');
                statusText.innerText = 'النظام متصل ويحدث فورياً';
            } else {
                statusContainer.classList.remove('online');
                statusText.innerText = 'غير متصل - جاري إعادة الاتصال...';
            }
        });
    </script>
</body>
</html>
