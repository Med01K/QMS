<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام إدارة طابور الانتظار | Système de gestion de file d'attente</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      max-width: 480px;
      width: 100%;
    }

    /* عرض ثنائي اللغة */
    .bilingual {
      display: flex;
      flex-direction: column;
      gap: 2px;
      line-height: 1.15;
    }
    .ar {
      direction: rtl;
      unicode-bidi: isolate;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    }
    .fr {
      direction: ltr;
      unicode-bidi: isolate;
    }

    h1 {
      color: #333;
      font-size: 22px;
      margin-bottom: 12px;
      font-weight: 700;
    }
    h1 .ar { font-weight: 800; }
    h1 .fr { font-weight: 800; }

    .number-box {
      background: #f8f9fa;
      border-radius: 16px;
      padding: 10px;
      margin: 15px 0 10px;
      border: 2px solid #e9ecef;
    }
    .number {
      font-size: 88px;
      color: #0d6efd;
      font-weight: 800;
      line-height: 1.1;
      transition: color 0.3s ease, transform 0.2s ease;
    }
    .number.updated { transform: scale(1.08); color: #198754; }

    .user-section {
      background: #f1f3f5;
      padding: 16px;
      border-radius: 16px;
      margin: 16px 0;
      text-align: left;
    }
    .user-section h3 {
      font-size: 15px;
      color: #333;
      margin-bottom: 10px;
      text-align: center;
      font-weight: 800;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }
    .input-group label {
      font-size: 12px;
      color: #495057;
      font-weight: 600;
      line-height: 1.25;
    }
    .input-group label .ar,
    .input-group label .fr {
      display: block;
      font-weight: 700;
    }
    .input-group label .ar { text-align: right; }
    .input-group label .fr { text-align: left; }

    .input-group input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ced4da;
      font-size: 14px;
      outline: none;
    }
    .input-group input:focus {
      border-color: #0d6efd;
    }

    .alert-banner {
      display: none;
      background-color: #fff3cd;
      color: #664d03;
      border: 1px solid #ffecb5;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
      margin-top: 10px;
      text-align: center;
    }
    .alert-banner.active { display: block; }
    .alert-banner.urgent {
      background-color: #f8d7da;
      color: #842029;
      border-color: #f5c2c7;
    }

    .status-container {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 20px;
      background-color: #f8d7da;
      color: #842029;
      margin-top: 12px;
      user-select: none;
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background-color: #dc3545;
      display: inline-block;
      flex: 0 0 auto;
    }
    .status-container.online { background-color: #d1e7dd; color: #0f5132; }
    .status-container.online .status-dot {
      background-color: #198754;
      box-shadow: 0 0 8px #198754;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1 class="bilingual">
      <span class="ar" dir="rtl">رقم التذكرة الحالي</span>
      <span class="fr" dir="ltr">Numéro de ticket actuel</span>
    </h1>

    <div class="number-box">
      <div class="number" id="queueNum">--</div>
    </div>

    <!-- Section de suivi du ticket utilisateur -->
    <div class="user-section">
      <h3 class="bilingual">
        <span class="ar" dir="rtl">تتبّع تذكرتك</span>
        <span class="fr" dir="ltr">Suivi de votre ticket</span>
      </h3>

      <div class="input-group">
        <label for="myTicketInput">
          <span class="ar" dir="rtl">رقم تذكرتك:</span>
          <span class="fr" dir="ltr">Votre numéro de ticket :</span>
        </label>
        <input type="number" id="myTicketInput" placeholder="مثال: 45 | Ex : 45" min="1" />
      </div>

      <div class="input-group">
        <label for="thresholdInput">
          <span class="ar" dir="rtl">هامش التنبيه (عدد الأشخاص قبلك):</span>
          <span class="fr" dir="ltr">Marge d'alerte (personnes avant vous) :</span>
        </label>
        <input type="number" id="thresholdInput" value="10" min="1" />
      </div>

      <div id="alertBanner" class="alert-banner"></div>
    </div>

    <div class="status-container" id="statusContainer">
      <span class="status-dot"></span>
      <span id="statusText" class="bilingual">
        <span class="ar" dir="rtl">جارٍ الاتصال...</span>
        <span class="fr" dir="ltr">Connexion en cours...</span>
      </span>
    </div>
  </div>

  <script>
    /***********************
     * Configuration Firebase
     ***********************/
    const DB_BASE = "https://qms-online-2658d-default-rtdb.firebaseio.com";
    const AUTH_QS = "";

    const STREAM_URL = `${DB_BASE}/queue.json?print=silent${AUTH_QS}`;
    const TICKET_URL = `${DB_BASE}/queue/current_ticket.json${AUTH_QS}`;

    const queueNumEl = document.getElementById('queueNum');
    const statusContainer = document.getElementById('statusContainer');
    const statusText = document.getElementById('statusText');
    const myTicketInput = document.getElementById('myTicketInput');
    const thresholdInput = document.getElementById('thresholdInput');
    const alertBanner = document.getElementById('alertBanner');

    const state = {
      current_ticket: null,
      lastAlertedDiff: null
    };

    /***********************
     * Helpers (Bilingue + sécurité HTML بسيطة)
     ***********************/
    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function setBilingualHTML(el, arText, frText) {
      el.innerHTML =
        `<span class="ar" dir="rtl">${escapeHtml(arText)}</span>` +
        `<span class="fr" dir="ltr">${escapeHtml(frText)}</span>`;
    }

    function setBanner(arText, frText, { active = true, urgent = false } = {}) {
      setBilingualHTML(alertBanner, arText, frText);
      alertBanner.classList.toggle('active', !!active);
      alertBanner.classList.toggle('urgent', !!urgent);
    }

    function clearBanner() {
      alertBanner.classList.remove('active', 'urgent');
      alertBanner.innerHTML = "";
    }

    /***********************
     * Notifications (Permission + Envoi)
     ***********************/
    async function requestNotificationPermission() {
      if (!("Notification" in window)) return;
      if (Notification.permission === "denied") return;

      if (Notification.permission === "default") {
        try {
          const permission = await Notification.requestPermission();
          if (permission === "granted") {
            sendSystemNotification(
              "تم تفعيل الإشعارات — Notifications activées",
              "ستتلقى تنبيهًا عندما يقترب دورك.\nVous recevrez une alerte quand votre tour approche."
            );
          }
        } catch (e) {}
      }
    }

    function sendSystemNotification(title, body) {
      if ("Notification" in window && Notification.permission === "granted") {
        try {
          new Notification(title, {
            body: body,
            icon: "https://cdn-icons-png.flaticon.com/512/3602/3602145.png"
          });
        } catch (e) {
          console.error("خطأ في إرسال الإشعار — Erreur d'envoi de notification:", e);
        }
      }
    }

    /***********************
     * Audio (دائمًا مفعّل لكن يحتاج أول تفاعل ليفتح AudioContext)
     ***********************/
    let audioCtx = null;
    const soundEnabled = true;

    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        return audioCtx.resume();
      }
      return Promise.resolve();
    }

    let initDone = false;
    async function initAudioAndNotifications() {
      if (initDone) return;
      initDone = true;

      try { await ensureAudio(); } catch {}
      await requestNotificationPermission();
    }

    // محاولة عند التحميل (قد لا تنجح بدون تفاعل)
    initAudioAndNotifications();

    // تفعيل تلقائي عند أول تفاعل (بدون زر)
    const firstGestureEvents = ["pointerdown", "touchstart", "mousedown", "keydown"];
    firstGestureEvents.forEach(evt => {
      window.addEventListener(evt, initAudioAndNotifications, { once: true, passive: true });
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        ensureAudio().catch(() => {});
      }
    });

    // صوت التحذير فقط (double bip)
    function playAlertBeep() {
      if (!soundEnabled) return;
      ensureAudio().then(() => {
        if (!audioCtx) return;

        const playTone = (freq, time, duration) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, time);
          gain.gain.setValueAtTime(0.25, time);
          gain.gain.exponentialRampToValueAtTime(0.00001, time + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(time);
          osc.stop(time + duration);
        };

        const now = audioCtx.currentTime;
        playTone(987.77, now, 0.25);       // Note B5
        playTone(1318.51, now + 0.3, 0.4); // Note E6
      }).catch(() => {});
    }

    function triggerUpdateAnimation() {
      queueNumEl.classList.add('updated');
      setTimeout(() => queueNumEl.classList.remove('updated'), 400);
    }

    /***********************
     * Vérification de l'alerte ticket et déclenchement
     ***********************/
    function checkUserAlert(currentTicket) {
      const myTicket = parseInt(myTicketInput.value, 10);
      const threshold = parseInt(thresholdInput.value, 10) || 10;

      if (isNaN(myTicket) || currentTicket === null || isNaN(currentTicket)) {
        clearBanner();
        state.lastAlertedDiff = null;
        return false;
      }

      const diff = myTicket - currentTicket;
      let alertTriggered = false;

      if (diff === 0) {
        const arMsg = "لقد حان دورك! تفضّل إلى الشباك.";
        const frMsg = "C'est votre tour ! Présentez-vous au guichet.";
        setBanner(arMsg, frMsg, { active: true, urgent: true });

        if (state.lastAlertedDiff !== 0) {
          playAlertBeep();
          sendSystemNotification(
            "طابور الانتظار — File d'attente",
            `${arMsg}\n${frMsg}`
          );
          state.lastAlertedDiff = 0;
          alertTriggered = true;
        }
      } else if (diff > 0 && diff <= threshold) {
        const arMsg = `انتباه! بقي أمامك ${diff} شخص/أشخاص قبل دورك.`;
        const frMsg = `Attention ! Il reste ${diff} personne(s) avant votre tour.`;
        setBanner(arMsg, frMsg, { active: true, urgent: false });

        if (state.lastAlertedDiff !== diff) {
          playAlertBeep();
          sendSystemNotification(
            "تنبيه: يقترب دورك — Alerte tour approche",
            `${arMsg}\n${frMsg}`
          );
          state.lastAlertedDiff = diff;
          alertTriggered = true;
        }
      } else if (diff < 0) {
        const arMsg = "لقد فات دورك.";
        const frMsg = "Votre tour est déjà passé.";
        setBanner(arMsg, frMsg, { active: true, urgent: true });
        state.lastAlertedDiff = diff;
      } else {
        clearBanner();
        state.lastAlertedDiff = diff;
      }

      return alertTriggered;
    }

    myTicketInput.addEventListener('input', () => checkUserAlert(state.current_ticket));
    thresholdInput.addEventListener('input', () => checkUserAlert(state.current_ticket));

    /***********************
     * Mise à jour de l'interface
     ***********************/
    function setTicket(val) {
      if (val === null || typeof val === "undefined") return;

      const old = queueNumEl.textContent;
      const next = Number(val);
      const isNumberChanged = (old !== '--' && old !== String(next));

      queueNumEl.textContent = String(next);

      // هذه الدالة هي التي تُطلق صوت التحذير فقط عند الاقتراب/الدور
      checkUserAlert(next);

      // فقط حركة/أنيميشن عند التحديث (بدون صوت تحديث)
      if (isNumberChanged) {
        triggerUpdateAnimation();
      }
    }

    function setOnline(isOnline, arMsg, frMsg) {
      if (isOnline) statusContainer.classList.add('online');
      else statusContainer.classList.remove('online');

      const ar = arMsg || (isOnline ? "النظام متصل" : "غير متصل - جارٍ إعادة الاتصال...");
      const fr = frMsg || (isOnline ? "Système connecté" : "Hors ligne - Reconnexion...");
      setBilingualHTML(statusText, ar, fr);
    }

    /***********************
     * Données initiales (Fetch)
     ***********************/
    async function initialFetch() {
      try {
        const tRes = await fetch(TICKET_URL);
        if (!tRes.ok) throw new Error("Fetch failed");

        const ticket = await tRes.json();
        state.current_ticket = ticket;
        setTicket(ticket);
      } catch (e) {
        // Le flux SSE prendra le relais
      }
    }

    /***********************
     * Flux en temps réel (SSE)
     ***********************/
    let es = null;

    function applyStreamPayload(payload) {
      if (!payload || typeof payload !== "object") return;

      const { path, data } = payload;

      if (path === "/") {
        if (data && typeof data === "object" && "current_ticket" in data) {
          state.current_ticket = data.current_ticket;
          setTicket(data.current_ticket);
        }
        return;
      }

      const key = path.replace("/", "");
      if (key === "current_ticket") {
        state.current_ticket = data;
        setTicket(data);
      }
    }

    function connectStream() {
      if (es) {
        try { es.close(); } catch {}
        es = null;
      }

      setOnline(false, "جارٍ الاتصال بالنظام...", "Connexion au système...");

      es = new EventSource(STREAM_URL);

      es.onopen = () => {
        setOnline(true, "النظام متصل", "Système connecté");
      };

      es.addEventListener("put", (e) => {
        try { applyStreamPayload(JSON.parse(e.data)); } catch {}
      });

      es.addEventListener("patch", (e) => {
        try { applyStreamPayload(JSON.parse(e.data)); } catch {}
      });

      es.onmessage = (e) => {
        try { applyStreamPayload(JSON.parse(e.data)); } catch {}
      };

      es.onerror = () => {
        setOnline(false, "غير متصل - جارٍ إعادة الاتصال...", "Hors ligne - Reconnexion...");
      };
    }

    // Démarrage
    initialFetch();
    connectStream();
  </script>
</body>
</html>
