<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Système de gestion de file d'attente / نظام إدارة طابور الانتظار</title>

  <!-- Fonts (اختياري لكن يعطي شكل أجمل بكثير للعربية والفرنسية) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root{
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --success: #16a34a;

      --warn-bg: #fffbeb;
      --warn-bd: #fde68a;
      --warn-tx: #92400e;

      --danger-bg: #fef2f2;
      --danger-bd: #fecaca;
      --danger-tx: #991b1b;

      --online-bg: #ecfdf5;
      --online-tx: #065f46;
      --online-dot: #16a34a;

      --offline-bg: #fef2f2;
      --offline-tx: #991b1b;
      --offline-dot: #dc2626;
    }

    body {
      font-family: Inter, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background: radial-gradient(1200px 600px at 50% -10%, #e8f0ff, var(--bg));
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      color: var(--text);
    }

    .card {
      background: var(--card);
      padding: 28px 22px;
      border-radius: 22px;
      box-shadow: 0 18px 50px rgba(17,24,39,0.10);
      max-width: 560px;
      width: 100%;
      border: 1px solid rgba(229,231,235,0.7);
    }

    /* ====== مكوّن ثنائي اللغة (بدون شرطة مائلة) ====== */
    .bi{
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .bi .fr,
    .bi .ar{
      display: block;
      line-height: 1.2;
      unicode-bidi: isolate;
    }
    .bi .fr{
      direction: ltr;
      text-align: left;
      font-family: Inter, 'Segoe UI', Tahoma, sans-serif;
    }
    .bi .ar{
      direction: rtl;
      text-align: right;
      font-family: Tajawal, Tahoma, Arial, sans-serif;
    }
    .bi.center .fr,
    .bi.center .ar{
      text-align: center;
    }
    .bi.small .fr,
    .bi.small .ar{
      font-size: 12.5px;
      font-weight: 700;
      color: var(--muted);
    }

    .page-title{
      margin-bottom: 12px;
    }
    .page-title .ar{
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: 0.2px;
    }
    .page-title .fr{
      font-size: 12.5px;
      font-weight: 700;
      color: var(--muted);
    }

    .number-box {
      background: linear-gradient(180deg, #f8fafc, #ffffff);
      border-radius: 18px;
      padding: 14px 12px;
      margin: 14px 0 10px;
      border: 1px solid var(--border);
    }

    .number {
      font-size: 92px;
      color: var(--primary);
      font-weight: 800;
      line-height: 1;
      transition: color 0.25s ease, transform 0.18s ease;
      letter-spacing: 1px;
    }
    .number.updated { transform: scale(1.06); color: var(--success); }

    .user-section {
      background: #f9fafb;
      padding: 16px;
      border-radius: 16px;
      margin: 16px 0;
      border: 1px solid var(--border);
      text-align: initial;
    }

    .user-section h3 {
      margin-bottom: 10px;
    }
    .user-section h3 .ar{
      font-size: 15px;
      font-weight: 800;
      color: var(--text);
      text-align: center;
    }
    .user-section h3 .fr{
      font-size: 12.5px;
      font-weight: 700;
      color: var(--muted);
      text-align: center;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .input-group label .ar{
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
    }
    .input-group label .fr{
      font-size: 12.5px;
      font-weight: 700;
      color: var(--muted);
    }

    .input-group input {
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 14px;
      outline: none;
      background: #fff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .input-group input:focus {
      border-color: rgba(37,99,235,0.55);
      box-shadow: 0 0 0 4px rgba(37,99,235,0.12);
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      padding: 12px 14px;
      cursor: pointer;
      transition: filter 0.15s ease, transform 0.05s ease, background 0.2s ease;
      margin-top: 4px;
    }
    .btn:hover { filter: brightness(0.96); }
    .btn:active { transform: translateY(1px); }
    .btn .bi.small .ar,
    .btn .bi.small .fr{
      color: rgba(255,255,255,0.92);
      font-weight: 800;
    }

    /* ✅ حالة "تم تفعيل التتبع" للزر */
    .btn.active { background: var(--success); }
    .btn.active:hover { filter: brightness(0.97); }

    .alert-banner {
      display: none;
      background-color: var(--warn-bg);
      color: var(--warn-tx);
      border: 1px solid var(--warn-bd);
      padding: 12px 12px;
      border-radius: 12px;
      margin-top: 10px;
      text-align: center;
    }
    .alert-banner.active { display: block; }
    .alert-banner.urgent {
      background-color: var(--danger-bg);
      color: var(--danger-tx);
      border-color: var(--danger-bd);
    }
    .alert-banner .bi.small .fr,
    .alert-banner .bi.small .ar{
      color: inherit;
      font-weight: 800;
    }

    .status-container {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 16px;
      user-select: none;
      width: 100%;
      justify-content: center;
      border: 1px solid rgba(0,0,0,0.05);
      background-color: var(--offline-bg);
      color: var(--offline-tx);
    }

    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background-color: var(--offline-dot);
      display: inline-block;
      flex: 0 0 auto;
      box-shadow: 0 0 0 4px rgba(220,38,38,0.10);
    }

    .status-container.online {
      background-color: var(--online-bg);
      color: var(--online-tx);
    }
    .status-container.online .status-dot {
      background-color: var(--online-dot);
      box-shadow: 0 0 0 4px rgba(22,163,74,0.12);
    }
  </style>
</head>

<body>
  <div class="card">
    <h1 class="page-title">
      <div class="bi center">
        <span class="ar" lang="ar">رقم التذكرة الحالي</span>
        <span class="fr" lang="fr">Numéro de ticket actuel</span>
      </div>
    </h1>

    <div class="number-box">
      <div class="number" id="queueNum">--</div>
    </div>

    <div class="user-section">
      <h3>
        <div class="bi center">
          <span class="ar" lang="ar">تتبُّع تذكرتك</span>
          <span class="fr" lang="fr">Suivi de votre ticket</span>
        </div>
      </h3>

      <div class="input-group">
        <label for="myTicketInput">
          <div class="bi">
            <span class="ar" lang="ar">رقم تذكرتك</span>
            <span class="fr" lang="fr">Votre numéro de ticket</span>
          </div>
        </label>
        <input type="number" id="myTicketInput" placeholder="Ex : 45 — مثال: 45" min="1" />
      </div>

      <div class="input-group">
        <label for="thresholdInput">
          <div class="bi">
            <span class="ar" lang="ar">هامش التنبيه (عدد الأشخاص قبلك)</span>
            <span class="fr" lang="fr">Marge d'alerte (personnes avant vous)</span>
          </div>
        </label>
        <input type="number" id="thresholdInput" value="10" min="1" />
      </div>

      <!-- زر: لا تظهر التحذيرات إلا عند الضغط هنا -->
      <button id="verifyBtn" class="btn" type="button">
        <span class="bi center small">
          <span class="ar" lang="ar">تحقّق وابدأ التتبّع</span>
          <span class="fr" lang="fr">Vérifier et démarrer le suivi</span>
        </span>
      </button>

      <div id="alertBanner" class="alert-banner"></div>
    </div>

    <div class="status-container" id="statusContainer">
      <span class="status-dot"></span>
      <span id="statusText" style="width:100%;">
        <span class="bi center small">
          <span class="ar" lang="ar">جارٍ الاتصال...</span>
          <span class="fr" lang="fr">Connexion en cours...</span>
        </span>
      </span>
    </div>
  </div>

  <script>
    /***********************
     * Configuration Firebase
     ***********************/
    const DB_BASE = "https://qms-online-2658d-default-rtdb.firebaseio.com";
    const AUTH_QS = "";

    const STREAM_URL = `${DB_BASE}/queue.json?print=silent${AUTH_QS}`;
    const TICKET_URL = `${DB_BASE}/queue/current_ticket.json${AUTH_QS}`;

    const queueNumEl = document.getElementById('queueNum');
    const statusContainer = document.getElementById('statusContainer');
    const statusText = document.getElementById('statusText');
    const myTicketInput = document.getElementById('myTicketInput');
    const thresholdInput = document.getElementById('thresholdInput');
    const alertBanner = document.getElementById('alertBanner');
    const verifyBtn = document.getElementById('verifyBtn');

    const state = {
      current_ticket: null,
      lastAlertedDiff: null,

      // ✅ لا نفحص إلا بعد الضغط على زر التحقق
      trackingEnabled: false,

      // لمنع أي فحص أثناء التحرير (احتياط إضافي)
      userEditing: false
    };

    /***********************
     * Helpers: ثنائي اللغة (سطرين، بدون "/")
     ***********************/
    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function biHTML(frText, arText, extraClass = "small") {
      return `
        <span class="bi center ${extraClass}">
          <span class="ar" lang="ar">${escapeHtml(arText)}</span>
          <span class="fr" lang="fr">${escapeHtml(frText)}</span>
        </span>
      `;
    }

    function setStatus(frText, arText) {
      statusText.innerHTML = biHTML(frText, arText, "small");
    }

    function setBanner(frText, arText, { active = true, urgent = false } = {}) {
      alertBanner.innerHTML = biHTML(frText, arText, "small");
      alertBanner.classList.toggle('active', !!active);
      alertBanner.classList.toggle('urgent', !!urgent);
    }

    function clearBanner() {
      alertBanner.classList.remove('active', 'urgent');
      alertBanner.innerHTML = "";
    }

    /***********************
     * ✅ زر التتبع: حالة تُثبت أنه تم الضغط
     ***********************/
    const verifyBtnAr = verifyBtn.querySelector('.ar');
    const verifyBtnFr = verifyBtn.querySelector('.fr');

    function setVerifyBtnState(isActive){
      verifyBtn.classList.toggle('active', !!isActive);

      if (isActive) {
        verifyBtnAr.textContent = "التتبّع مُفعّل";
        verifyBtnFr.textContent = "Suivi activé";
      } else {
        verifyBtnAr.textContent = "تحقّق وابدأ التتبّع";
        verifyBtnFr.textContent = "Vérifier et démarrer le suivi";
      }
    }

    // الحالة الافتراضية
    setVerifyBtnState(false);

    /***********************
     * Notifications (Permission + Envoi)
     ***********************/
    async function requestNotificationPermission() {
      if (!("Notification" in window)) return;
      if (Notification.permission === "denied") return;

      if (Notification.permission === "default") {
        try {
          const permission = await Notification.requestPermission();
          if (permission === "granted") {
            sendSystemNotification(
              "تم تفعيل الإشعارات",
              "ستتلقى تنبيهًا عندما يقترب دورك."
            );
          }
        } catch (e) {}
      }
    }

    function sendSystemNotification(title, body) {
      if ("Notification" in window && Notification.permission === "granted") {
        try {
          new Notification(title, {
            body: body,
            icon: "https://cdn-icons-png.flaticon.com/512/3602/3602145.png"
          });
        } catch (e) {
          console.error("Erreur d'envoi de notification / خطأ في إرسال الإشعار:", e);
        }
      }
    }

    /***********************
     * Audio (دائمًا مفعّل لكن يحتاج أول تفاعل)
     ***********************/
    let audioCtx = null;
    const soundEnabled = true;

    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') return audioCtx.resume();
      return Promise.resolve();
    }

    let initDone = false;
    async function initAudioAndNotifications() {
      if (initDone) return;
      initDone = true;

      try { await ensureAudio(); } catch {}
      await requestNotificationPermission();
    }

    // محاولة عند التحميل (قد لا تنجح بدون تفاعل)
    initAudioAndNotifications();

    // تفعيل تلقائي عند أول تفاعل (بدون زر)
    ["pointerdown", "touchstart", "mousedown", "keydown"].forEach(evt => {
      window.addEventListener(evt, initAudioAndNotifications, { once: true, passive: true });
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") ensureAudio().catch(() => {});
    });

    function playAlertBeep() {
      if (!soundEnabled) return;
      ensureAudio().then(() => {
        if (!audioCtx) return;

        const playTone = (freq, time, duration) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, time);
          gain.gain.setValueAtTime(0.25, time);
          gain.gain.exponentialRampToValueAtTime(0.00001, time + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(time);
          osc.stop(time + duration);
        };

        const now = audioCtx.currentTime;
        playTone(987.77, now, 0.25);
        playTone(1318.51, now + 0.3, 0.4);
      }).catch(() => {});
    }

    /* ✅ أنيميشن الرقم: إعادة تشغيله كل مرة (حتى لو ضغطت الزر) */
    function triggerUpdateAnimation() {
      queueNumEl.classList.remove('updated');
      void queueNumEl.offsetWidth; // force reflow لإعادة تشغيل الأنيميشن
      queueNumEl.classList.add('updated');
      setTimeout(() => queueNumEl.classList.remove('updated'), 350);
    }

    /***********************
     * Alerte utilisateur
     ***********************/
    function checkUserAlert(currentTicket) {
      const myTicket = parseInt(myTicketInput.value, 10);
      const threshold = parseInt(thresholdInput.value, 10) || 10;

      if (isNaN(myTicket) || currentTicket === null || isNaN(currentTicket)) {
        clearBanner();
        state.lastAlertedDiff = null;
        return false;
      }

      const diff = myTicket - currentTicket;
      let alertTriggered = false;

      if (diff === 0) {
        const frMsg = "C'est votre tour ! Présentez-vous au guichet.";
        const arMsg = "لقد حان دورك! يُرجى التوجّه إلى الشباك.";
        setBanner(frMsg, arMsg, { active: true, urgent: true });

        if (state.lastAlertedDiff !== 0) {
          playAlertBeep();
          sendSystemNotification("طابور الانتظار", arMsg);
          state.lastAlertedDiff = 0;
          alertTriggered = true;
        }
      } else if (diff > 0 && diff <= threshold) {
        const frMsg = `Attention ! Il reste ${diff} personne(s) avant votre tour.`;
        const arMsg = `تنبيه! يتبقّى أمامك ${diff} شخص/أشخاص قبل دورك.`;
        setBanner(frMsg, arMsg, { active: true, urgent: false });

        if (state.lastAlertedDiff !== diff) {
          playAlertBeep();
          sendSystemNotification("تنبيه: يقترب دورك", arMsg);
          state.lastAlertedDiff = diff;
          alertTriggered = true;
        }
      } else if (diff < 0) {
        setBanner("Votre tour est déjà passé.", "لقد فات دورك.", { active: true, urgent: true });
        state.lastAlertedDiff = diff;
      } else {
        clearBanner();
        state.lastAlertedDiff = diff;
      }

      return alertTriggered;
    }

    /***********************
     * ✅ منطق الزر: لا تحذير أثناء الكتابة
     ***********************/
    function disableTrackingWhileEditing() {
      state.trackingEnabled = false;  // لن نحدث التحذيرات إلا بعد ضغط الزر
      state.lastAlertedDiff = null;   // إعادة ضبط حتى لا يصدر تنبيه قديم
      clearBanner();                  // اخفاء التحذير القديم أثناء التعديل
      setVerifyBtnState(false);       // ✅ يرجع الزر لحالة "غير مُفعّل"
    }

    myTicketInput.addEventListener('focus', () => { state.userEditing = true; });
    thresholdInput.addEventListener('focus', () => { state.userEditing = true; });

    myTicketInput.addEventListener('blur', () => { state.userEditing = false; });
    thresholdInput.addEventListener('blur', () => { state.userEditing = false; });

    // عند أي كتابة: فقط نخفي التحذير ونوقف التتبع (بدون فحص)
    myTicketInput.addEventListener('input', disableTrackingWhileEditing);
    thresholdInput.addEventListener('input', disableTrackingWhileEditing);

    function startTrackingAndCheck() {
      // تفعيل الصوت/الإشعارات عند ضغط الزر (يُعتبر تفاعل مستخدم)
      initAudioAndNotifications();

      state.userEditing = false;
      state.trackingEnabled = true;
      state.lastAlertedDiff = null;

      // ✅ آلية واضحة أن الزر تم الضغط + نفس تأثير تحديث الرقم
      setVerifyBtnState(true);
      triggerUpdateAnimation();

      checkUserAlert(state.current_ticket);
    }

    verifyBtn.addEventListener('click', startTrackingAndCheck);

    // Enter = مثل الضغط على زر تحقق
    function onEnterToVerify(e){
      if (e.key === 'Enter') {
        e.preventDefault();
        startTrackingAndCheck();
      }
    }
    myTicketInput.addEventListener('keydown', onEnterToVerify);
    thresholdInput.addEventListener('keydown', onEnterToVerify);

    /***********************
     * Mise à jour UI
     ***********************/
    function setTicket(val) {
      if (val === null || typeof val === "undefined") return;

      const old = queueNumEl.textContent;
      const next = Number(val);
      const isNumberChanged = (old !== '--' && old !== String(next));

      queueNumEl.textContent = String(next);

      // ✅ لا نفحص إلا إذا المستخدم ضغط "تحقق" وفعّل التتبع
      // واحتياطًا: ليس أثناء التحرير
      if (state.trackingEnabled && !state.userEditing) {
        checkUserAlert(next);
      }

      if (isNumberChanged) triggerUpdateAnimation();
    }

    function setOnline(isOnline, frMsg, arMsg) {
      if (isOnline) statusContainer.classList.add('online');
      else statusContainer.classList.remove('online');

      const fr = frMsg || (isOnline ? "Système connecté" : "Hors ligne - Reconnexion...");
      const ar = arMsg || (isOnline ? "النظام متصل" : "غير متصل - جارٍ إعادة الاتصال...");
      setStatus(fr, ar);
    }

    /***********************
     * Données initiales (Fetch)
     ***********************/
    async function initialFetch() {
      try {
        const tRes = await fetch(TICKET_URL);
        if (!tRes.ok) throw new Error("Fetch failed");
        const ticket = await tRes.json();
        state.current_ticket = ticket;
        setTicket(ticket);
      } catch (e) {
        // Le flux SSE prendra le relais
      }
    }

    /***********************
     * Flux en temps réel (SSE)
     ***********************/
    let es = null;

    function applyStreamPayload(payload) {
      if (!payload || typeof payload !== "object") return;

      const { path, data } = payload;

      if (path === "/") {
        if (data && typeof data === "object" && "current_ticket" in data) {
          state.current_ticket = data.current_ticket;
          setTicket(data.current_ticket);
        }
        return;
      }

      const key = path.replace("/", "");
      if (key === "current_ticket") {
        state.current_ticket = data;
        setTicket(data);
      }
    }

    function connectStream() {
      if (es) {
        try { es.close(); } catch {}
        es = null;
      }

      setOnline(false, "Connexion au système...", "جارٍ الاتصال بالنظام...");

      es = new EventSource(STREAM_URL);

      es.onopen = () => {
        setOnline(true, "Système connecté", "النظام متصل");
      };

      es.addEventListener("put", (e) => {
        try { applyStreamPayload(JSON.parse(e.data)); } catch {}
      });

      es.addEventListener("patch", (e) => {
        try { applyStreamPayload(JSON.parse(e.data)); } catch {}
      });

      es.onmessage = (e) => {
        try { applyStreamPayload(JSON.parse(e.data)); } catch {}
      };

      es.onerror = () => {
        setOnline(false, "Hors ligne - Reconnexion...", "غير متصل - جارٍ إعادة الاتصال...");
      };
    }

    // Démarrage
    initialFetch();
    connectStream();
  </script>
</body>
</html>
