<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Système de gestion de file d'attente / نظام إدارة طابور الانتظار</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root{
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #2563eb;
      --success: #16a34a;

      --warn-bg: #fffbeb;
      --warn-bd: #fde68a;
      --warn-tx: #92400e;

      --danger-bg: #fef2f2;
      --danger-bd: #fecaca;
      --danger-tx: #991b1b;

      --online-bg: #ecfdf5;
      --online-tx: #065f46;
      --online-dot: #16a34a;

      --offline-bg: #fef2f2;
      --offline-tx: #991b1b;
      --offline-dot: #dc2626;

      --closed-bg: #fffbeb;
      --closed-tx: #92400e;
      --closed-dot: #f59e0b;
    }

    body {
      font-family: Inter, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background: radial-gradient(1200px 600px at 50% -10%, #e8f0ff, var(--bg));
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      color: var(--text);
    }

    .card {
      background: var(--card);
      padding: 28px 22px;
      border-radius: 22px;
      box-shadow: 0 18px 50px rgba(17,24,39,0.10);
      max-width: 560px;
      width: 100%;
      border: 1px solid rgba(229,231,235,0.7);
    }

    .bi{ display: flex; flex-direction: column; gap: 4px; }
    .bi .fr, .bi .ar{ display:block; line-height:1.2; unicode-bidi:isolate; }
    .bi .fr{ direction:ltr; text-align:left; font-family:Inter, 'Segoe UI', Tahoma, sans-serif; }
    .bi .ar{ direction:rtl; text-align:right; font-family:Tajawal, Tahoma, Arial, sans-serif; }
    .bi.center .fr, .bi.center .ar{ text-align:center; }
    .bi.small .fr, .bi.small .ar{ font-size:12.5px; font-weight:700; color:var(--muted); }

    .page-title{ margin-bottom: 12px; }
    .page-title .ar{ font-size:20px; font-weight:800; color:var(--text); letter-spacing:0.2px; }
    .page-title .fr{ font-size:12.5px; font-weight:700; color:var(--muted); }

    .number-box{
      background: linear-gradient(180deg, #f8fafc, #ffffff);
      border-radius: 18px;
      padding: 14px 12px;
      margin: 14px 0 10px;
      border: 1px solid var(--border);
    }
    .number{
      font-size: 92px;
      color: var(--primary);
      font-weight: 800;
      line-height: 1;
      transition: color 0.25s ease, transform 0.18s ease;
      letter-spacing: 1px;
    }
    .number.updated{ transform: scale(1.06); color: var(--success); }
    .number.closed{ color: var(--muted); }

    .user-section{
      background:#f9fafb;
      padding:16px;
      border-radius:16px;
      margin:16px 0;
      border:1px solid var(--border);
      text-align:initial;
    }

    .user-section h3{ margin-bottom:10px; }
    .user-section h3 .ar{ font-size:15px; font-weight:800; color:var(--text); text-align:center; }
    .user-section h3 .fr{ font-size:12.5px; font-weight:700; color:var(--muted); text-align:center; }

    .input-group{ display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
    .input-group label .ar{ font-size:13px; font-weight:800; color:var(--text); }
    .input-group label .fr{ font-size:12.5px; font-weight:700; color:var(--muted); }

    .input-group input{
      padding:11px 12px;
      border-radius:10px;
      border:1px solid var(--border);
      font-size:14px;
      outline:none;
      background:#fff;
      transition:border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .input-group input:focus{
      border-color: rgba(37,99,235,0.55);
      box-shadow: 0 0 0 4px rgba(37,99,235,0.12);
    }

    .btn{
      width:100%;
      max-width:280px;
      margin:8px auto 0;
      display:block;
      border:1px solid rgba(0,0,0,0.06);
      border-radius:12px;
      background:var(--primary);
      color:#fff;
      padding:12px 14px;
      cursor:pointer;
      box-shadow:none;
      transition: filter 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
    }
    .btn:hover{ filter: brightness(0.97); }
    .btn .bi .ar{ color:rgba(255,255,255,0.98); font-weight:900; font-size:16px; letter-spacing:0.2px; }
    .btn .bi .fr{ color:rgba(255,255,255,0.92); font-weight:800; font-size:12.5px; }
    .btn.active{ background:var(--success); border-color:rgba(0,0,0,0.08); filter:none; }
    .btn:disabled{ opacity:0.65; cursor:not-allowed; }
    .btn:disabled:hover{ filter:none; }

    .alert-banner{
      display:none;
      background-color:var(--warn-bg);
      color:var(--warn-tx);
      border:1px solid var(--warn-bd);
      padding:12px 12px;
      border-radius:12px;
      margin-top:10px;
      text-align:center;
    }
    .alert-banner.active{ display:block; }
    .alert-banner.urgent{
      background-color:var(--danger-bg);
      color:var(--danger-tx);
      border-color:var(--danger-bd);
    }
    .alert-banner .bi.small .fr,
    .alert-banner .bi.small .ar{ color:inherit; font-weight:800; }

    .status-container{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border-radius:16px;
      user-select:none;
      width:100%;
      justify-content:center;
      border:1px solid rgba(0,0,0,0.05);
      background-color:var(--offline-bg);
      color:var(--offline-tx);
    }
    .status-dot{
      width:10px; height:10px; border-radius:50%;
      background-color:var(--offline-dot);
      display:inline-block;
      flex:0 0 auto;
      box-shadow:0 0 0 4px rgba(220,38,38,0.10);
    }
    .status-container.online{ background-color:var(--online-bg); color:var(--online-tx); }
    .status-container.online .status-dot{ background-color:var(--online-dot); box-shadow:0 0 0 4px rgba(22,163,74,0.12); }

    /* closed UI */
    .status-container.closed{
      background-color: var(--closed-bg);
      color: var(--closed-tx);
      border-color: rgba(245,158,11,0.35);
    }
    .status-container.closed .status-dot{
      background-color: var(--closed-dot);
      box-shadow: 0 0 0 4px rgba(245,158,11,0.14);
    }
  </style>
</head>

<body>
  <div class="card">
    <h1 class="page-title">
      <div class="bi center">
        <span class="ar" lang="ar">رقم التذكرة الحالي</span>
        <span class="fr" lang="fr">Numéro de ticket actuel</span>
      </div>
    </h1>

    <div class="number-box">
      <div class="number" id="queueNum">--</div>
    </div>

    <div class="user-section">
      <h3>
        <div class="bi center">
          <span class="ar" lang="ar">تتبُّع تذكرتك</span>
          <span class="fr" lang="fr">Suivi de votre ticket</span>
        </div>
      </h3>

      <div class="input-group">
        <label for="myTicketInput">
          <div class="bi">
            <span class="ar" lang="ar">رقم تذكرتك</span>
            <span class="fr" lang="fr">Votre numéro de ticket</span>
          </div>
        </label>
        <input type="number" id="myTicketInput" placeholder="Ex : 45 — مثال: 45" min="1" />
      </div>

      <div class="input-group">
        <label for="thresholdInput">
          <div class="bi">
            <span class="ar" lang="ar">هامش التنبيه (عدد الأشخاص قبلك)</span>
            <span class="fr" lang="fr">Marge d'alerte (personnes avant vous)</span>
          </div>
        </label>
        <input type="number" id="thresholdInput" value="10" min="0" />
      </div>

      <button id="verifyBtn" class="btn" type="button" aria-pressed="false">
        <span class="bi center">
          <span class="ar" id="verifyBtnAr" lang="ar">تتبّع</span>
          <span class="fr" id="verifyBtnFr" lang="fr">Suivi</span>
        </span>
      </button>

      <div id="alertBanner" class="alert-banner"></div>
    </div>

    <div class="status-container" id="statusContainer">
      <span class="status-dot"></span>
      <span id="statusText" style="width:100%;">
        <span class="bi center small">
          <span class="ar" lang="ar">جارٍ الاتصال...</span>
          <span class="fr" lang="fr">Connexion en cours...</span>
        </span>
      </span>
    </div>
  </div>

  <script>
    /***********************
     * Firebase REST config
     ***********************/
    const DB_BASE = "https://qms-online-2658d-default-rtdb.firebaseio.com";
    const AUTH_TOKEN = ""; // optional

    function makeUrl(path, params = {}) {
      const url = new URL(DB_BASE.replace(/\/$/, "") + "/" + path.replace(/^\//, "") + ".json");
      Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, String(v)));
      if (AUTH_TOKEN) url.searchParams.set("auth", AUTH_TOKEN);
      return url.toString();
    }

    const STREAM_URL = makeUrl("queue", { print: "silent" });
    const TICKET_URL = makeUrl("queue/current_ticket");
    const QUEUE_URL  = makeUrl("queue");
    const OFFSET_URL = makeUrl(".info/serverTimeOffset");

    /***********************
     * Auto-close if ESP32 inactive
     * ESP32 must update:
     * queue/meta/esp32_last_seen_ms  (server timestamp in ms)
     ***********************/
    const AUTO_CLOSE_MINUTES = 0.2; // ضع 30 في الإنتاج
    const AUTO_CLOSE_MS = AUTO_CLOSE_MINUTES * 60 * 1000;
    const CLOSED_CHECK_MS = Math.max(1000, Math.min(30000, Math.floor(AUTO_CLOSE_MS / 2) || 1000));

    const POLL_VISIBLE_MS = 8000;
    const POLL_HIDDEN_MS  = 15000;

    const queueNumEl = document.getElementById('queueNum');
    const statusContainer = document.getElementById('statusContainer');
    const statusText = document.getElementById('statusText');
    const myTicketInput = document.getElementById('myTicketInput');
    const thresholdInput = document.getElementById('thresholdInput');
    const alertBanner = document.getElementById('alertBanner');
    const verifyBtn = document.getElementById('verifyBtn');
    const verifyBtnAr = document.getElementById('verifyBtnAr');
    const verifyBtnFr = document.getElementById('verifyBtnFr');

    const state = {
      current_ticket: null,
      lastKnownTicket: null,

      lastAlertedDiff: null,
      trackingEnabled: false,
      userEditing: false,

      isOnline: false,

      serverOffset: 0,

      // heartbeat
      esp32_last_seen_ms: null,
      metaLoaded: false,

      systemClosed: false
    };

    /***********************
     * UI helpers
     ***********************/
    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function biHTML(frText, arText, extraClass = "small") {
      return `
        <span class="bi center ${extraClass}">
          <span class="ar" lang="ar">${escapeHtml(arText)}</span>
          <span class="fr" lang="fr">${escapeHtml(frText)}</span>
        </span>
      `;
    }

    function setStatus(frText, arText) {
      statusText.innerHTML = biHTML(frText, arText, "small");
    }

    function setBanner(frText, arText, { active = true, urgent = false } = {}) {
      alertBanner.innerHTML = biHTML(frText, arText, "small");
      alertBanner.classList.toggle('active', !!active);
      alertBanner.classList.toggle('urgent', !!urgent);
    }

    function clearBanner() {
      alertBanner.classList.remove('active', 'urgent');
      alertBanner.innerHTML = "";
    }

    function setVerifyBtnActive(isActive){
      verifyBtn.classList.toggle('active', !!isActive);
      verifyBtn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      if (isActive) {
        verifyBtnAr.textContent = "يتم التتبع الآن";
        verifyBtnFr.textContent = "Suivi en cours";
      } else {
        verifyBtnAr.textContent = "تتبّع";
        verifyBtnFr.textContent = "Suivi";
      }
    }
    setVerifyBtnActive(false);

    function triggerUpdateAnimation() {
      queueNumEl.classList.add('updated');
      setTimeout(() => queueNumEl.classList.remove('updated'), 350);
    }

    /***********************
     * Server time
     ***********************/
    async function fetchServerOffset() {
      try {
        const res = await fetch(OFFSET_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("offset fetch failed");
        const offset = await res.json();
        if (typeof offset === "number" && Number.isFinite(offset)) {
          state.serverOffset = offset;
        }
      } catch {}
    }
    function serverNow() {
      return Date.now() + (state.serverOffset || 0);
    }

    /***********************
     * Closed mode (ONE PLACE MESSAGE)
     * ملاحظة: رسالة "مغلق" ستظهر فقط في الشريط السفلي (status-container)
     * ولن تظهر في banner لتجنب التكرار.
     ***********************/
    function closedMessage() {
      const fr = `Système fermé`;
      const ar = `النظام مغلق`;
      return { fr, ar };
    }

    function renderTicketNumber() {
      if (state.systemClosed) {
        queueNumEl.textContent = "--";
        queueNumEl.classList.add("closed");
        return;
      }
      queueNumEl.classList.remove("closed");
      queueNumEl.textContent = (state.lastKnownTicket === null || !Number.isFinite(state.lastKnownTicket))
        ? "--"
        : String(state.lastKnownTicket);
    }

    function stopTrackingHard() {
      state.trackingEnabled = false;
      state.lastAlertedDiff = null;
      setVerifyBtnActive(false);
      stopPolling();
    }

    function setSystemClosed(isClosed) {
      const next = !!isClosed;
      if (state.systemClosed === next) return;
      state.systemClosed = next;

      // عند الإغلاق: أوقف التتبع وأخفِ banner (حتى لا تتكرر الرسالة)
      if (next) {
        clearBanner();
        stopTrackingHard();
        verifyBtn.disabled = true;
      } else {
        verifyBtn.disabled = false;
      }

      renderTicketNumber();
      updateStatusUI();
    }

    function updateClosedState() {
      if (!state.metaLoaded) return;

      const lastSeen = Number(state.esp32_last_seen_ms);

      // إذا لم توجد قيمة last_seen: اعتبر النظام مغلق (ESP32 لم يرسل أصلاً)
      if (!Number.isFinite(lastSeen)) {
        setSystemClosed(true);
        return;
      }

      const idle = serverNow() - lastSeen;
      setSystemClosed(idle >= AUTO_CLOSE_MS);
    }

    function updateStatusUI() {
      statusContainer.classList.remove("online", "closed");

      if (!state.isOnline) {
        setStatus("Hors ligne - Reconnexion...", "غير متصل - جارٍ إعادة الاتصال...");
        return;
      }

      if (state.systemClosed) {
        statusContainer.classList.add("closed");
        const msg = closedMessage();
        setStatus(msg.fr, msg.ar);
        return;
      }

      statusContainer.classList.add("online");
      setStatus("Système connecté", "النظام متصل");
    }

    setInterval(updateClosedState, CLOSED_CHECK_MS);

    /***********************
     * Threshold clamp (fix)
     ***********************/
    function getNumbersForDiff() {
      const myTicket = parseInt(myTicketInput.value, 10);
      const currentTicket = Number(state.current_ticket);
      if (!Number.isFinite(currentTicket)) return { ok:false };
      if (Number.isNaN(myTicket) || myTicket < 1) return { ok:false };
      return { ok:true, myTicket, currentTicket };
    }

    function updateThresholdConstraints({ clamp = false } = {}) {
      const info = getNumbersForDiff();
      if (!info.ok) {
        thresholdInput.removeAttribute("max");
        return { applied:false, clamped:false, maxAllowed:null };
      }

      const diff = info.myTicket - info.currentTicket;
      const maxAllowed = Math.max(0, diff);
      thresholdInput.max = String(maxAllowed);

      if (!clamp) return { applied:true, clamped:false, maxAllowed };

      const thr = parseInt(thresholdInput.value, 10);
      if (Number.isNaN(thr)) return { applied:true, clamped:false, maxAllowed };

      const clampedValue = Math.min(Math.max(0, thr), maxAllowed);
      const clamped = clampedValue !== thr;
      if (clamped) thresholdInput.value = String(clampedValue);

      return { applied:true, clamped, maxAllowed, clampedValue };
    }

    /***********************
     * Service Worker
     ***********************/
    async function registerSW() {
      if (!("serviceWorker" in navigator)) return false;
      try {
        await navigator.serviceWorker.register("./sw.js", { scope: "./" });
        return true;
      } catch {
        return false;
      }
    }
    registerSW();

    /***********************
     * Notifications
     ***********************/
    async function ensureNotificationsEnabled() {
      if (!("Notification" in window)) {
        setBanner("Notifications non supportées.", "الإشعارات غير مدعومة في هذا المتصفح.", { active:true, urgent:true });
        return false;
      }
      if (!window.isSecureContext) {
        setBanner("Ouvrez en HTTPS.", "افتح الموقع عبر HTTPS.", { active:true, urgent:true });
        return false;
      }

      if (Notification.permission === "granted") return true;

      if (Notification.permission === "denied") {
        setBanner(
          "Notifications bloquées. Autorisez-les dans les paramètres du site.",
          "الإشعارات محظورة. فعّلها من إعدادات الموقع.",
          { active:true, urgent:true }
        );
        return false;
      }

      let permission = "default";
      try { permission = await Notification.requestPermission(); } catch {}
      if (permission !== "granted") {
        setBanner(
          "Veuillez autoriser les notifications pour recevoir les alertes.",
          "يرجى السماح بالإشعارات لكي يصلك التنبيه.",
          { active:true, urgent:true }
        );
        return false;
      }

      await sendSystemNotification("تم تفعيل الإشعارات", "ستتلقى تنبيهًا عندما يقترب دورك.");
      return true;
    }

    async function sendSystemNotification(title, body) {
      if (!("Notification" in window)) return;
      if (!window.isSecureContext) return;
      if (Notification.permission !== "granted") return;

      const options = {
        body,
        tag: "qms-alert",
        renotify: true,
        icon: "https://cdn-icons-png.flaticon.com/512/3602/3602145.png",
        vibrate: [200, 80, 200]
      };

      try {
        if ("serviceWorker" in navigator) {
          const reg = await navigator.serviceWorker.getRegistration();
          if (reg && reg.showNotification) {
            await reg.showNotification(title, options);
            return;
          }
        }
      } catch {}

      try { new Notification(title, options); } catch {}
    }

    /***********************
     * Audio
     ***********************/
    let audioCtx = null;
    const soundEnabled = true;

    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') return audioCtx.resume();
      return Promise.resolve();
    }

    let audioInitDone = false;
    async function initAudioOnce() {
      if (audioInitDone) return;
      audioInitDone = true;
      try { await ensureAudio(); } catch {}
    }

    ["pointerdown", "touchstart", "mousedown", "keydown"].forEach(evt => {
      window.addEventListener(evt, initAudioOnce, { once: true, passive: true });
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") ensureAudio().catch(() => {});
    });

    function playAlertBeep() {
      if (!soundEnabled) return;
      ensureAudio().then(() => {
        if (!audioCtx) return;

        const playTone = (freq, time, duration) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, time);
          gain.gain.setValueAtTime(0.25, time);
          gain.gain.exponentialRampToValueAtTime(0.00001, time + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(time);
          osc.stop(time + duration);
        };

        const now = audioCtx.currentTime;
        playTone(987.77, now, 0.25);
        playTone(1318.51, now + 0.3, 0.4);
      }).catch(() => {});
    }

    /***********************
     * Alerts (banner reserved ONLY for ticket alerts)
     ***********************/
    function checkUserAlert(currentTicket) {
      if (state.systemClosed) return false;

      if (!state.userEditing) updateThresholdConstraints({ clamp: true });
      else updateThresholdConstraints({ clamp: false });

      const myTicket = parseInt(myTicketInput.value, 10);
      const thresholdParsed = parseInt(thresholdInput.value, 10);
      const threshold = Number.isNaN(thresholdParsed) ? 10 : thresholdParsed;

      if (isNaN(myTicket) || currentTicket === null || isNaN(Number(currentTicket))) {
        clearBanner();
        state.lastAlertedDiff = null;
        return false;
      }

      const diff = myTicket - Number(currentTicket);
      let alertTriggered = false;

      if (diff === 0) {
        const frMsg = "C'est votre tour ! Présentez-vous au guichet.";
        const arMsg = "لقد حان دورك! يُرجى التوجّه إلى الشباك.";
        setBanner(frMsg, arMsg, { active: true, urgent: true });

        if (state.lastAlertedDiff !== 0) {
          playAlertBeep();
          if (navigator.vibrate) { try { navigator.vibrate([200, 80, 200]); } catch {} }
          sendSystemNotification("طابور الانتظار", arMsg);
          state.lastAlertedDiff = 0;
          alertTriggered = true;
        }
      } else if (diff > 0 && diff <= threshold) {
        const frMsg = `Attention ! Il reste ${diff} personne(s) avant votre tour.`;
        const arMsg = `تنبيه! مازال ${diff} شخص/أشخاص قبل دورك.`;
        setBanner(frMsg, arMsg, { active: true, urgent: false });

        if (state.lastAlertedDiff !== diff) {
          playAlertBeep();
          if (navigator.vibrate) { try { navigator.vibrate(120); } catch {} }
          sendSystemNotification("تنبيه: يقترب دورك", arMsg);
          state.lastAlertedDiff = diff;
          alertTriggered = true;
        }
      } else if (diff < 0) {
        setBanner("Votre tour est déjà passé.", "لقد فات دورك.", { active: true, urgent: true });
        state.lastAlertedDiff = diff;
      } else {
        clearBanner();
        state.lastAlertedDiff = diff;
      }

      return alertTriggered;
    }

    /***********************
     * Polling
     ***********************/
    let pollTimer = null;

    async function pollCurrentTicketOnce() {
      if (state.systemClosed) return;
      try {
        const res = await fetch(TICKET_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("poll failed");
        const ticket = await res.json();
        state.current_ticket = ticket;
        setTicket(ticket);
      } catch {}
    }

    function startPolling() {
      stopPolling();
      const period = (document.visibilityState === "visible") ? POLL_VISIBLE_MS : POLL_HIDDEN_MS;
      pollTimer = setInterval(pollCurrentTicketOnce, period);
      pollCurrentTicketOnce();
    }

    function stopPolling() {
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    function disableTrackingWhileEditing() {
      stopTrackingHard();
      clearBanner();
    }

    function refreshUserEditingSoon(){
      setTimeout(() => {
        const ae = document.activeElement;
        state.userEditing = (ae === myTicketInput || ae === thresholdInput);
      }, 0);
    }

    myTicketInput.addEventListener('focus', () => { state.userEditing = true; });
    thresholdInput.addEventListener('focus', () => { state.userEditing = true; });
    myTicketInput.addEventListener('blur', () => { refreshUserEditingSoon(); updateThresholdConstraints({ clamp: true }); });
    thresholdInput.addEventListener('blur', () => { refreshUserEditingSoon(); updateThresholdConstraints({ clamp: true }); });

    myTicketInput.addEventListener('input', disableTrackingWhileEditing);
    myTicketInput.addEventListener('change', () => { updateThresholdConstraints({ clamp: true }); });

    thresholdInput.addEventListener('input', () => { disableTrackingWhileEditing(); updateThresholdConstraints({ clamp: true }); });
    thresholdInput.addEventListener('change', () => { updateThresholdConstraints({ clamp: true }); });

    function inputsAreValidOrShowMessage(){
      const myTicket = parseInt(myTicketInput.value, 10);
      const threshold = parseInt(thresholdInput.value, 10);

      if (isNaN(myTicket) || myTicket < 1) {
        setBanner("Veuillez saisir un numéro de ticket valide.", "يرجى إدخال رقم تذكرة صحيح.", { active: true, urgent: true });
        return false;
      }
      if (isNaN(threshold) || threshold < 0) {
        setBanner("Veuillez saisir une marge d'alerte valide (>= 0).", "يرجى إدخال هامش تنبيه صحيح (>= 0).", { active: true, urgent: true });
        return false;
      }

      updateThresholdConstraints({ clamp: true });
      return true;
    }

    async function startTrackingAndCheck() {
      if (state.systemClosed) {
        // لا نعرض Banner هنا لتجنب تكرار رسالة "مغلق"
        // الرسالة موجودة فقط في الشريط السفلي
        stopTrackingHard();
        clearBanner();
        return;
      }

      initAudioOnce();
      await ensureNotificationsEnabled();

      if (!Number.isFinite(Number(state.current_ticket))) {
        await pollCurrentTicketOnce();
      }
      if (!Number.isFinite(Number(state.current_ticket))) {
        setBanner(
          "Impossible de récupérer le ticket actuel. Réessayez.",
          "تعذر جلب رقم التذكرة الحالي. أعد المحاولة.",
          { active:true, urgent:true }
        );
        setVerifyBtnActive(false);
        return;
      }

      updateThresholdConstraints({ clamp: true });

      if (!inputsAreValidOrShowMessage()) {
        setVerifyBtnActive(false);
        return;
      }

      state.userEditing = false;
      state.trackingEnabled = true;
      state.lastAlertedDiff = null;

      setVerifyBtnActive(true);
      startPolling();
      checkUserAlert(state.current_ticket);
    }

    verifyBtn.addEventListener('click', startTrackingAndCheck);

    function onEnterToVerify(e){
      if (e.key === 'Enter') {
        e.preventDefault();
        startTrackingAndCheck();
      }
    }
    myTicketInput.addEventListener('keydown', onEnterToVerify);
    thresholdInput.addEventListener('keydown', onEnterToVerify);

    /***********************
     * Ticket UI
     ***********************/
    function setTicket(val) {
      if (val === null || typeof val === "undefined") return;

      const oldShown = queueNumEl.textContent;
      const next = Number(val);

      state.lastKnownTicket = next;
      state.current_ticket = next;

      renderTicketNumber();
      updateThresholdConstraints({ clamp: false });

      if (state.trackingEnabled && !state.userEditing && !state.systemClosed) {
        checkUserAlert(next);
      }

      if (!state.systemClosed && oldShown !== '--' && oldShown !== String(next)) {
        triggerUpdateAnimation();
      }
    }

    function setOnline(isOnline) {
      state.isOnline = !!isOnline;
      updateStatusUI();
    }

    /***********************
     * Initial fetch (queue + heartbeat)
     ***********************/
    async function initialFetch() {
      try {
        const res = await fetch(QUEUE_URL, { cache: "no-store" });
        if (!res.ok) throw new Error("Fetch failed");
        const data = await res.json();

        state.metaLoaded = true;

        if (data && typeof data === "object") {
          if ("current_ticket" in data) {
            state.current_ticket = data.current_ticket;
            state.lastKnownTicket = Number(data.current_ticket);
          }

          if (data.meta && typeof data.meta === "object" && "esp32_last_seen_ms" in data.meta) {
            state.esp32_last_seen_ms = data.meta.esp32_last_seen_ms;
          }
        }

        updateClosedState();
        renderTicketNumber();
        updateStatusUI();
      } catch {
        // لا تغيّر metaLoaded هنا
      }
    }

    /***********************
     * SSE stream
     ***********************/
    let es = null;
    let reconnectTimer = null;

    function scheduleReconnect() {
      if (reconnectTimer) return;
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        connectStream();
      }, 4000);
    }

    function applyStreamPayload(payload) {
      if (!payload || typeof payload !== "object") return;

      const { path, data } = payload;

      if (path === "/") {
        if (data && typeof data === "object") {
          state.metaLoaded = true;

          if ("current_ticket" in data) setTicket(data.current_ticket);

          if (data.meta && typeof data.meta === "object" && "esp32_last_seen_ms" in data.meta) {
            state.esp32_last_seen_ms = data.meta.esp32_last_seen_ms;
            updateClosedState();
          }
        }
        return;
      }

      const cleanPath = String(path || "");
      if (cleanPath === "/current_ticket") {
        setTicket(data);
        return;
      }

      if (cleanPath === "/meta/esp32_last_seen_ms") {
        state.metaLoaded = true;
        state.esp32_last_seen_ms = data;
        updateClosedState();
        return;
      }
    }

    function connectStream() {
      if (es) {
        try { es.close(); } catch {}
        es = null;
      }

      setOnline(false);

      try {
        es = new EventSource(STREAM_URL);

        es.onopen = () => {
          setOnline(true);
          updateClosedState();
        };

        es.addEventListener("put", (e) => { try { applyStreamPayload(JSON.parse(e.data)); } catch {} });
        es.addEventListener("patch", (e) => { try { applyStreamPayload(JSON.parse(e.data)); } catch {} });
        es.onmessage = (e) => { try { applyStreamPayload(JSON.parse(e.data)); } catch {} };

        es.onerror = () => {
          setOnline(false);
          scheduleReconnect();
        };
      } catch {
        setOnline(false);
        scheduleReconnect();
      }
    }

    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "visible") {
        await fetchServerOffset();
        await initialFetch();
        connectStream();
      }
      if (state.trackingEnabled && !state.systemClosed) startPolling();
      else stopPolling();
    });

    // Start
    (async function start() {
      await fetchServerOffset();
      await initialFetch();
      connectStream();
      renderTicketNumber();
      updateStatusUI();
    })();
  </script>
</body>
</html>
