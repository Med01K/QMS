<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Système de gestion de file d'attente</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      max-width: 480px;
      width: 100%;
    }
    h1 {
      color: #333;
      font-size: 22px;
      margin-bottom: 12px;
      font-weight: 700;
    }
    .number-box {
      background: #f8f9fa;
      border-radius: 16px;
      padding: 10px;
      margin: 15px 0 10px;
      border: 2px solid #e9ecef;
    }
    .number {
      font-size: 88px;
      color: #0d6efd;
      font-weight: 800;
      line-height: 1.1;
      transition: color 0.3s ease, transform 0.2s ease;
    }
    .number.updated { transform: scale(1.08); color: #198754; }

    .console-info {
      font-size: 18px;
      color: #495057;
      margin: 14px 0 18px;
      background: #e7f1ff;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #b6d4fe;
    }
    .console-num { font-weight: bold; color: #0d6efd; font-size: 22px; }

    .user-section {
      background: #f1f3f5;
      padding: 16px;
      border-radius: 16px;
      margin: 16px 0;
      text-align: left;
    }
    .user-section h3 {
      font-size: 15px;
      color: #333;
      margin-bottom: 10px;
      text-align: center;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }
    .input-group label {
      font-size: 12px;
      color: #495057;
      font-weight: 600;
    }
    .input-group input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ced4da;
      font-size: 14px;
      outline: none;
    }
    .input-group input:focus {
      border-color: #0d6efd;
    }

    .alert-banner {
      display: none;
      background-color: #fff3cd;
      color: #664d03;
      border: 1px solid #ffecb5;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: bold;
      margin-top: 10px;
      text-align: center;
    }
    .alert-banner.active { display: block; }
    .alert-banner.urgent {
      background-color: #f8d7da;
      color: #842029;
      border-color: #f5c2c7;
    }

    .row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    button {
      border: 0;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      background: #0d6efd;
      color: #fff;
      font-size: 13px;
    }
    button.secondary { background: #6c757d; }

    .status-container {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 20px;
      background-color: #f8d7da;
      color: #842029;
      margin-top: 12px;
      user-select: none;
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background-color: #dc3545;
      display: inline-block;
    }
    .status-container.online { background-color: #d1e7dd; color: #0f5132; }
    .status-container.online .status-dot {
      background-color: #198754;
      box-shadow: 0 0 8px #198754;
    }

    .hint {
      margin-top: 14px;
      font-size: 11px;
      color: #6c757d;
      line-height: 1.5;
    }
    code { background: #e9ecef; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>

<body>
  <div class="card">
    <h1>Numéro de ticket actuel</h1>

    <div class="number-box">
      <div class="number" id="queueNum">--</div>
    </div>

    <div class="console-info">
      Guichet / Console : <span class="console-num" id="consoleNum">--</span>
    </div>

    <!-- Section de suivi du ticket utilisateur -->
    <div class="user-section">
      <h3>Suivi de votre ticket</h3>
      <div class="input-group">
        <label for="myTicketInput">Votre numéro de ticket :</label>
        <input type="number" id="myTicketInput" placeholder="Ex: 45" min="1" />
      </div>
      <div class="input-group">
        <label for="thresholdInput">Marge d'alerte (personnes avant vous) :</label>
        <input type="number" id="thresholdInput" value="10" min="1" />
      </div>
      <div id="alertBanner" class="alert-banner"></div>
    </div>

    <div class="status-container" id="statusContainer">
      <span class="status-dot"></span>
      <span id="statusText">Connexion en cours...</span>
    </div>

    <div class="row">
      <button id="enableSoundBtn" class="secondary" type="button">Activer le son</button>
      <button id="reconnectBtn" type="button">Régénérer la connexion</button>
    </div>

    <div class="hint">
      Compatible avec ESP32 :
      <br/>
      <code>/queue/current_ticket</code> et <code>/queue/current_console</code>
    </div>
  </div>

  <script>
    /***********************
     * Configuration Firebase
     ***********************/
    const DB_BASE = "https://qms-online-2658d-default-rtdb.firebaseio.com";
    const AUTH_QS = "";

    const STREAM_URL  = `${DB_BASE}/queue.json?print=silent${AUTH_QS}`;
    const TICKET_URL  = `${DB_BASE}/queue/current_ticket.json${AUTH_QS}`;
    const CONSOLE_URL = `${DB_BASE}/queue/current_console.json${AUTH_QS}`;

    const queueNumEl = document.getElementById('queueNum');
    const consoleNumEl = document.getElementById('consoleNum');
    const statusContainer = document.getElementById('statusContainer');
    const statusText = document.getElementById('statusText');
    const enableSoundBtn = document.getElementById('enableSoundBtn');
    const reconnectBtn = document.getElementById('reconnectBtn');
    const myTicketInput = document.getElementById('myTicketInput');
    const thresholdInput = document.getElementById('thresholdInput');
    const alertBanner = document.getElementById('alertBanner');

    const state = {
      current_ticket: null,
      current_console: null
    };

    /***********************
     * Gestion de l'audio
     ***********************/
    let audioCtx = null;
    let soundEnabled = false;

    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') return audioCtx.resume();
      return Promise.resolve();
    }

    function playChime() {
      if (!soundEnabled || !audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.7);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.7);
    }

    enableSoundBtn.addEventListener('click', async () => {
      try {
        await ensureAudio();
        soundEnabled = true;
        enableSoundBtn.textContent = "Son activé";
        enableSoundBtn.classList.remove('secondary');
      } catch (e) {
        alert("Le navigateur a bloqué l'audio. Veuillez rééayer.");
      }
    });

    function triggerUpdateAnimation() {
      queueNumEl.classList.add('updated');
      setTimeout(() => queueNumEl.classList.remove('updated'), 400);
    }

    /***********************
     * Vérification de l'alerte ticket
     ***********************/
    function checkUserAlert(currentTicket) {
      const myTicket = parseInt(myTicketInput.value, 10);
      const threshold = parseInt(thresholdInput.value, 10) || 10;

      if (isNaN(myTicket) || currentTicket === null || isNaN(currentTicket)) {
        alertBanner.classList.remove('active', 'urgent');
        return;
      }

      const diff = myTicket - currentTicket;

      if (diff === 0) {
        alertBanner.textContent = "C'est votre tour ! Présentez-vous au guichet.";
        alertBanner.classList.add('active', 'urgent');
        playChime();
      } else if (diff > 0 && diff <= threshold) {
        alertBanner.textContent = `Attention ! Il reste ${diff} personne(s) avant votre tour.`;
        alertBanner.classList.add('active');
        alertBanner.classList.remove('urgent');
        playChime();
      } else if (diff < 0) {
        alertBanner.textContent = "Votre tour est déjà passé.";
        alertBanner.classList.add('active', 'urgent');
      } else {
        alertBanner.classList.remove('active', 'urgent');
      }
    }

    myTicketInput.addEventListener('input', () => checkUserAlert(state.current_ticket));
    thresholdInput.addEventListener('input', () => checkUserAlert(state.current_ticket));

    /***********************
     * Mise à jour de l'interface
     ***********************/
    function setTicket(val) {
      if (val === null || typeof val === "undefined") return;

      const old = queueNumEl.textContent;
      const next = Number(val);

      if (old !== '--' && old !== String(next)) {
        playChime();
        triggerUpdateAnimation();
      }
      queueNumEl.textContent = String(next);
      checkUserAlert(next);
    }

    function setConsole(val) {
      if (val === null || typeof val === "undefined") return;
      consoleNumEl.textContent = String(val);
    }

    function setOnline(isOnline, msg) {
      if (isOnline) statusContainer.classList.add('online');
      else statusContainer.classList.remove('online');
      statusText.textContent = msg || (isOnline ? "Système connecté" : "Hors ligne - Reconnexion...");
    }

    /***********************
     * Données initiales (Fetch)
     ***********************/
    async function initialFetch() {
      try {
        const [tRes, cRes] = await Promise.all([fetch(TICKET_URL), fetch(CONSOLE_URL)]);
        if (!tRes.ok || !cRes.ok) throw new Error("Fetch failed");

        const ticket = await tRes.json();
        const cons = await cRes.json();

        state.current_ticket = ticket;
        state.current_console = cons;

        setTicket(ticket);
        setConsole(cons);
      } catch (e) {
        // En cas d'erreur, le stream prendra le relais
      }
    }

    /***********************
     * Flux en temps réel (SSE)
     ***********************/
    let es = null;

    function applyStreamPayload(payload) {
      if (!payload || typeof payload !== "object") return;

      const { path, data } = payload;

      if (path === "/") {
        if (data && typeof data === "object") {
          if ("current_ticket" in data) {
            state.current_ticket = data.current_ticket;
            setTicket(data.current_ticket);
          }
          if ("current_console" in data) {
            state.current_console = data.current_console;
            setConsole(data.current_console);
          }
        }
        return;
      }

      const key = path.replace("/", "");
      if (key === "current_ticket") {
        state.current_ticket = data;
        setTicket(data);
      } else if (key === "current_console") {
        state.current_console = data;
        setConsole(data);
      }
    }

    function connectStream() {
      if (es) {
        try { es.close(); } catch {}
        es = null;
      }

      setOnline(false, "Connexion au système...");

      es = new EventSource(STREAM_URL);

      es.onopen = () => {
        setOnline(true, "Système connecté");
      };

      es.addEventListener("put", (e) => {
        try { applyStreamPayload(JSON.parse(e.data)); } catch {}
      });

      es.addEventListener("patch", (e) => {
        try { applyStreamPayload(JSON.parse(e.data)); } catch {}
      });

      es.onmessage = (e) => {
        try { applyStreamPayload(JSON.parse(e.data)); } catch {}
      };

      es.onerror = () => {
        setOnline(false, "Hors ligne - Reconnexion...");
      };
    }

    reconnectBtn.addEventListener('click', () => {
      connectStream();
      initialFetch();
    });

    // Démarrage
    initialFetch();
    connectStream();
  </script>
</body>
</html>
